apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: database
  labels:
    app: rabbitmq
    tier: database
    env: test00
spec:
  serviceName: "rabbitmq"
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.8-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          env:
            - name: RABBITMQ_ERLANG_COOKIE
              value: "my-secret-cookie"
      restartPolicy: Always
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: database
  labels:
    app: rabbitmq
    tier: database
    env: test00
spec:
  clusterIP: None  # headless service for StatefulSet
  selector:
    app: rabbitmq
  ports:
    - port: 5672
      targetPort: 5672
    - port: 15672
      targetPort: 15672
