apiVersion: v1
kind: Namespace
metadata:
  name: instana-agent
  labels:
    app.kubernetes.io/name: instana-agent
    app.kubernetes.io/version: 1.2.74
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: instana-agent
  namespace: instana-agent
  labels:
    app.kubernetes.io/name: instana-agent
    app.kubernetes.io/version: 1.2.74
---
apiVersion: v1
kind: Service
metadata:
  name: instana-agent
  namespace: instana-agent
spec:
  selector:
    app.kubernetes.io/name: instana-agent
  ports:
    - name: agent-apis
      protocol: TCP
      port: 42699
      targetPort: 42699
    - name: opentelemetry
      protocol: TCP
      port: 55680
      targetPort: 55680
    - name: opentelemetry-iana
      protocol: TCP
      port: 4317
      targetPort: 4317
    - name: opentelemetry-http
      protocol: TCP
      port: 4318
      targetPort: 4318
  internalTrafficPolicy: Local
---
apiVersion: v1
kind: Service
metadata:
  name: instana-agent-headless
  namespace: instana-agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: instana-agent
  ports:
    - name: agent-apis
      protocol: TCP
      port: 42699
      targetPort: 42699
    - name: opentelemetry
      protocol: TCP
      port: 55680
      targetPort: 55680
    - name: opentelemetry-iana
      protocol: TCP
      port: 4317
      targetPort: 4317
    - name: opentelemetry-http
      protocol: TCP
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: Secret
metadata:
  name: instana-agent
  namespace: instana-agent
type: Opaque
data:
  key: UDNKY1BIRkVUM2F6RW9qWEtwZ1ZSQQ==
  downloadKey: UDNKY1BIRkVUM2F6RW9qWEtwZ1ZSQQ==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: instana-agent
  namespace: instana-agent
data:
  cluster_name: ""
  configuration.yaml: |
    # Minimal config for Instana Agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: instana-agent
  namespace: instana-agent
  labels:
    app.kubernetes.io/name: instana-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: instana-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: instana-agent
    spec:
      serviceAccountName: instana-agent
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: instana-agent
          image: "icr.io/instana/agent:latest"
          imagePullPolicy: Always
          env:
            - name: INSTANA_AGENT_KEY
              value: "P3JcPHFET3azEojXKpgVRA"
            - name: INSTANA_AGENT_ENDPOINT
              value: "https://ingress-blue-saas.instana.io"
            - name: INSTANA_AGENT_DOWNLOAD_KEY
              value: "P3JcPHFET3azEojXKpgVRA"
            - name: INSTANA_AGENT_ZONE
              value: "k8s"
            - name: INSTANA_AGENT_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: instana-agent
                  key: cluster_name
            - name: INSTANA_AGENT_ANNOTATIONS
              value: "true"
            - name: INSTANA_AGENT_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INSTANA_AGENT_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: INSTANA_AGENT_K8S_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            privileged: true
          volumeMounts:
            - name: configuration
              subPath: configuration.yaml
              mountPath: /root/configuration.yaml
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /status
              port: 42699
            initialDelaySeconds: 600
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "100m"
      volumes:
        - name: configuration
          configMap:
            name: instana-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8sensor
  namespace: instana-agent
  labels:
    app: k8sensor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8sensor
  template:
    metadata:
      labels:
        app: k8sensor
    spec:
      serviceAccountName: k8sensor
      containers:
        - name: instana-agent
          image: "icr.io/instana/k8sensor:latest"
          imagePullPolicy: Always
          env:
            - name: AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: instana-agent
                  key: key
          volumeMounts:
            - name: configuration
              subPath: configuration.yaml
              mountPath: /root/configuration.yaml
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: configuration
          configMap:
            name: instana-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8sensor-role
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces", "events", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8sensor-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8sensor-role
subjects:
- kind: ServiceAccount
  name: k8sensor
  namespace: instana-agent

