apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-server
    spec:
      containers:
        - name: argocd-server
          image: argoproj/argocd:v2.9.11
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: argocd
spec:
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-initial-admin-secret
  namespace: argocd
type: Opaque
stringData:
  password: admin

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: robot-shop-services
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/robot-shop.git'
    targetRevision: HEAD
    path: deployments/services
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - Validate=false
      - PruneLast=true
      - Replace=true
      - ServerSideApply=true
      - Force=true
      - SkipSchemaValidation=true
      - ApplyOptions=--force-conflicts
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: robot-shop-database
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/robot-shop.git'
    targetRevision: HEAD
    path: deployments/infra
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - Validate=false
      - PruneLast=true
      - Replace=true
      - ServerSideApply=true
      - Force=true
      - SkipSchemaValidation=true
      - ApplyOptions=--force-conflicts
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-service-ingress
  namespace: argocd
  labels:
    app: argocd
    tier: ci/cd
    env: test00
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: argocd-test00.martsoft.se
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80