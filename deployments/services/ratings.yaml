apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratings
  namespace: services
  labels:
    app: ratings
    tier: backend
    env: test00
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ratings
  template:
    metadata:
      labels:
        app: ratings
    spec:
      containers:
        - name: ratings
          image: "martin2020i/ratings:v6.0.0"
          ports:
            - containerPort: 80
          env:
            - name: APP_ENV
              value: "test00"
            - name: CATALOGUE_URL
              value: "http://catalogue:8080"
            - name: PDO_URL
              value: "mysql:host=mysql.database.svc.cluster.local;port=3306;dbname=ratings"
            - name: PDO_USER
              value: "ratings"
            - name: PDO_PASSWORD
              value: "iloveit"
            - name: INSTANA_AGENT_ENDPOINT
              value: "212.227.245.234"
            - name: INSTANA_AGENT_ENDPOINT_PORT
              value: "42699" 
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -H \"X-INSTANA-SYNTHETIC: 1\" -f http://localhost/_health"]
            initialDelaySeconds: 10
            periodSeconds: 3600
            timeoutSeconds: 10
            failureThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ratings
  namespace: services
  labels:
    app: ratings
    tier: backend
    env: test00
spec:
  selector:
    app: ratings
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
