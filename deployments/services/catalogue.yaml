apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: services
  labels:
    app: catalogue
    tier: backend
    env: test00
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue
  template:
    metadata:
      labels:
        app: catalogue
    spec:
      containers:
        - name: catalogue
          image: martin2020i/catalogue:v6.0.0
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URL
              value: "mongodb://mongodb.database.svc.cluster.local:27017/catalogue"
            - name: GO_SLOW
              value: "0"
            - name: CATALOGUE_SERVER_PORT
              value: "8080"
            - name: INSTANA_AGENT_HOST
              value: "212.227.245.234"
            - name: INSTANA_AGENT_ENDPOINT_PORT
              value: "42699"
          resources:
            requests:
              cpu: 50m      
              memory: 128Mi  
            limits:
              cpu: 100m 
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: services
  labels:
    app: catalogue
    tier: backend
    env: test00
spec:
  selector:
    app: catalogue
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
