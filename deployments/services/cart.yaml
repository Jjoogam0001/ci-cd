apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: services
  labels:
    app: cart
    tier: backend
    env: test00
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      containers:
        - name: cart
          image: "martin2020i/cart:v6.0.0"
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              value: "redis-0.redis.database.svc.cluster.local:6379"
            - name: CATALOGUE_HOST
              value: "http://catalogue:8080"
          resources:
            requests:
              cpu: 50m       
              memory: 128Mi 
            limits:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: services
  labels:
    app: cart
    tier: backend
    env: test00
spec:
  selector:
    app: cart
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP