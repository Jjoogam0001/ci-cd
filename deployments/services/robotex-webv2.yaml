apiVersion: apps/v1
kind: Deployment
metadata:
  name: robotex
  namespace: services
  labels:
    app: robotex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: robotex
  template:
    metadata:
      labels:
        app: robotex
    spec:
      containers:
        - name: robotex
          image: "martin2020i/web-new-version:v1.0.0"
          ports:
            - containerPort: 80
          env:
            - name: CATALOGUE_HOST
              value: catalogue
            - name: USER_HOST
              value: user
            - name: CART_HOST
              value: cart
            - name: SHIPPING_HOST
              value: shipping
            - name: PAYMENT_HOST
              value: payment
            - name: RATINGS_HOST
              value: ratings
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: instana-config
              mountPath: /etc/instana-config.json
              subPath: instana-config.json
      volumes:
        - name: nginx-config
          configMap:
            name: robotex-nginx
        - name: instana-config
          configMap:
            name: instana-config
---
apiVersion: v1
kind: Service
metadata:
  name: robotex
  namespace: services
  labels:
    app: robotex
spec:
  type: ClusterIP
  selector:
    app: robotex
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: robotex-nginx
  namespace: services
data:
  default.conf: |
    load_module modules/ngx_http_opentracing_module.so;
    opentracing_load_tracer /usr/local/lib/libinstana_sensor.so /etc/instana-config.json;
    opentracing_propagate_context;

    server {
        listen       80;
        server_name  localhost;

        proxy_http_version 1.1;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            ssi    on;
        }

        location /images/ {
            expires 5s;
            root   /usr/share/nginx/html;
            try_files $uri /images/placeholder.png;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        location /api/catalogue/ {
            proxy_pass http://${CATALOGUE_HOST}:8080/;
        }

        location /api/user/ {
            proxy_pass http://${USER_HOST}:8080/;
        }

        location /api/cart/ {
            proxy_pass http://${CART_HOST}:8080/;
        }

        location /api/shipping/ {
            proxy_pass http://${SHIPPING_HOST}:8080/;
        }

        location /api/payment/ {
            proxy_pass http://${PAYMENT_HOST}:8080/;
        }

        location /api/ratings/ {
            proxy_pass http://${RATINGS_HOST}:80/;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: instana-config
  namespace: services
data:
  instana-config.json: |
    {
      "service": "robotex",
      "agent_host": "instana-agent.instana.svc.cluster.local",
      "agent_port": 42699
    }

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: robotex-service-ingress
  namespace: services
  labels:
    app: robotex
    tier: frontend
    env: test00
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: robotex-test00.martsoft.se
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: robotex
            port:
              number: 80