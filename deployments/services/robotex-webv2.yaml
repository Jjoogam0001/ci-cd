apiVersion: apps/v1
kind: Deployment
metadata:
  name: robotex
  namespace: services
  labels:
    app: robotex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robotex
  template:
    metadata:
      labels:
        app: robotex
    spec:
      containers:
        - name: robotex
          image: "martin2020i/web-new-version:v2.0.4"
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "512Mi"
          env:
            - name: CATALOGUE_HOST
              value: catalogue
            - name: USER_HOST
              value: user
            - name: CART_HOST
              value: cart
            - name: SHIPPING_HOST
              value: shipping
            - name: PAYMENT_HOST
              value: payment
            - name: RATINGS_HOST
              value: ratings
---
apiVersion: v1
kind: Service
metadata:
  name: robotex
  namespace: services
  labels:
    app: robotex
spec:
  type: ClusterIP
  selector:
    app: robotex
  ports:
    - port: 80
      targetPort: 80
---
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: robotex-ingress
  namespace: services
  labels:
    app: robotex
    tier: frontend
    env: test00
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: robotex.martsoft.se
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: robotex
            port:
              number: 80