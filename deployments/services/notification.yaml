apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: services
  labels:
    app: notification
    tier: backend
    env: test00
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: "martin2020i/notification-service:v6.0.0"
          env:
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq.database.svc.cluster.local:5672"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: services
  labels:
    app: notification
    tier: backend
    env: test00
spec:
  selector:
    app: notification
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
