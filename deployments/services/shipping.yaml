apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: services
  labels:
    app: shipping
    tier: backend
    env: test00
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
    spec:
      containers:
        - name: shipping
          image: "martin2020i/shipping:v6.0.0"
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "mysql.database.svc.cluster.local:3306"
            - name: CART_ENDPOINT
              value: "http://cart:8080"
            - name: INSTANA_AGENT_HOST
              value: "212.227.245.234"
            - name: INSTANA_AGENT_ENDPOINT_PORT
              value: "42699"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              httpHeaders:
                - name: X-INSTANA-SYNTHETIC
                  value: "1"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: services
  labels:
    app: shipping
    tier: backend
    env: test00
spec:
  selector:
    app: shipping
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
