apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  namespace: services
  labels:
    app: user
    tier: backend
    env: test00
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      containers:
        - name: user
          image: "martin2020i/user:v6.0.0"
          ports:
            - containerPort: 8080
          env:
            - name: MONGO_URL
              value: "mongodb://mongodb.database.svc.cluster.local:27017/user"
            - name: REDIS_HOST
              value: "redis.database.svc.cluster.local"
            - name: USER_SERVER_PORT
              value: "8080"
            - name: INSTANA_AGENT_HOST
              value: "212.227.245.234"
            - name: INSTANA_AGENT_ENDPOINT_PORT
              value: "42699"
            - name: AMQP_HOST
              value: "rabbitmq.database.svc.cluster.local:5672"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: user
  namespace: services
  labels:
    app: user
    tier: backend
    env: test00
spec:
  selector:
    app: user
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
