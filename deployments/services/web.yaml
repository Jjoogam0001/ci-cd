apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: services
  labels:
    app: web
    tier: frontend
    env: test00
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: "martin2020i/web:v6.0.0"
          ports:
            - containerPort: 80
          env:
              - name: INSTANA_EUM_KEY
                value: "P3JcPHFET3azEojXKpgVRA"
              - name: INSTANA_EUM_REPORTING_URL
                value: "https://ingress-blue-saas.instana.io"
              - name: INSTANA_AGENT_HOST
                value: "212.227.245.234"
              - name: INSTANA_AGENT_PORT
                value: "42699"
              - name: CATALOGUE_HOST
                value: "catalogue:8080"
              - name: DISPATCHER_HOST
                value: "dispatch:8080"
              - name: USER_HOST
                value: "user:8080"
              - name: AMQP_HOST
                value: "rabbitmq.database.svc.cluster.local"
              - name: CART_HOST
                value: "cart:8080"
              - name: PAYMENT_HOST
                value: "payment:8080"
              - name: SHIPPING_HOST
                value: "shipping:8080"
              - name: INSTANA_SERVICE_NAME
                value: "instana-agent"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: services
  labels:
    app: web
    tier: frontend
    env: test00
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-service-ingress
  namespace: services
  labels:
    app: web
    tier: frontend
    env: test00
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: robotex-test00.martsoft.se
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80