apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: services
  labels:
    app: web
    tier: frontend
    env: test00
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: "martin2020i/web:v6.0.0"
          ports:
            - containerPort: 80
          env:
              - name: INSTANA_EUM_KEY
                value: "<your eum key>"
              - name: INSTANA_EUM_REPORTING_URL
                value: "<your reporting url>"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "curl -H \"X-INSTANA-SYNTHETIC: 1\" -f http://localhost:80/ || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 3600
            timeoutSeconds: 10
            failureThreshold: 1
          resources:
            limits:
              memory: "512Mi"
              cpu: "125m"
            requests:
              memory: "128Mi"
              cpu: "125m"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: services
  labels:
    app: web
    tier: frontend
    env: test00
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-service-ingress
  namespace: services
  labels:
    app: web
    tier: frontend
    env: test00
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: robotex-test00.martsoft.se
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80