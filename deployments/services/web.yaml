apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: services
  labels:
    app: web
    tier: frontend
    env: test00
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: "martin2020i/web:v6.0.1"
          ports:
            - containerPort: 80
          env:
              - name: INSTANA_EUM_KEY
                value: "P3JcPHFET3azEojXKpgVRA"
              - name: INSTANA_EUM_REPORTING_URL
                value: "https://ingress-blue-saas.instana.io"
              - name: INSTANA_AGENT_HOST
                value: "212.227.245.234"
              - name: INSTANA_AGENT_PORT
                value: "42699"
              - name: CATALOGUE_HOST
                value: "catalogue"
              - name: DISPATCHER_HOST
                value: "dispatch"
              - name: USER_HOST
                value: "user"
              - name: AMQP_HOST
                value: "rabbitmq.database.svc.cluster.local"
              - name: CART_HOST
                value: "cart"
              - name: PAYMENT_HOST
                value: "payment"
              - name: SHIPPING_HOST
                value: "shipping"
              - name: INSTANA_SERVICE_NAME
                value: "instana-agent"
              - name: REDIS_HOST
                value: "redis.database.svc.cluster.local"
              - name: MONGO_URL
                value: "mongodb://mongodb.database.svc.cluster.local:27017/users"
              - name: INSTANA_DISABLE
                value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: services
  labels:
    app: web
    tier: frontend
    env: test00
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-service-ingress
  namespace: services
  labels:
    app: web
    tier: frontend
    env: test00
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: robotex-test00.martsoft.se
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 80